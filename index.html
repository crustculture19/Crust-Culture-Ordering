<!DOCTYPE html>
<html>
<head>
    <title>Crust Culture | Online Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍕 CRUST CULTURE</h1>
    <p>Freshly Baked. Crafted With Passion.</p>
</header>

<section>
    <h2>Our Menu</h2>

    <div id="menu">
        Loading menu...
    </div>

</section>

<section>
    <h2>Your Cart</h2>

    <div id="cart">
        Cart is empty
    </div>

    <h3>Total: ₹<span id="total">0</span></h3>

</section>


<section>
    <h2>Customer Details</h2>

    <input id="name" placeholder="Your Name">
    <br><br>

    <input id="phone" placeholder="Phone Number">
    <br><br>

    <textarea id="address" placeholder="Delivery Address"></textarea>

    <br><br>

    <button onclick="placeOrder()">
        Place Order
    </button>

</section>


<script type="module" src="app.js"></script>

</body>
</html>
